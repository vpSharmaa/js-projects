<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Number Finder</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:40px}
.container{max-width:650px;margin:auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 0 10px gray}
h1{text-align:center}
label{display:block;margin-top:15px;font-weight:bold}
input{width:100%;padding:8px;font-size:16px;box-sizing:border-box}
button{margin-top:20px;padding:10px 18px;font-size:16px;cursor:pointer}
#result{margin-top:25px;padding:15px;background:#eef;white-space:pre-line;font-size:18px}
</style>
</head>
<body>
<div class="container">
<h1>Lucky Number Finder</h1>

<label>Your Name</label>
<input type="text" id="name">

<label>Place of Birth</label>
<input type="text" id="place">

<label>Date of Birth</label>
<input type="date" id="dob">

<button onclick="findLuckyNumber()">Find Lucky Number</button>
<button onclick="retry()">Retry</button>

<div id="result"></div>
</div>

<script>
function findLuckyNumber(){

let name=document.getElementById("name").value.trim();
let place=document.getElementById("place").value.trim();
let dob=document.getElementById("dob").value;

if(name===""){alert("Please enter your name.");return;}
if(place===""){alert("Please enter your place of birth.");return;}
if(dob===""){alert("Please select your date of birth.");return;}

let digits=dob.replace(/-/g,"");
let total=0;
for(let digit of digits){ total+=Number(digit); }

while(total>9){
 let sum=0;
 while(total>0){
   sum+=total%10;
   total=Math.floor(total/10);
 }
 total=sum;
}

let date=new Date(dob);
let days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let birthDay=days[date.getDay()];

const prediction={
1:"You are a born leader. Today is favourable for taking initiative and beginning something new.",
2:"Peace and patience will guide you. Good relationships will bring happiness.",
3:"Creativity is your strength. Express yourself confidently today.",
4:"Hard work and discipline will produce success. Continue your efforts.",
5:"Exciting opportunities may come unexpectedly. Keep an open mind.",
6:"Family, love and responsibility are highlighted today.",
7:"A good day for study, meditation and self-improvement.",
8:"Financial progress is indicated. Stay practical and confident.",
9:"Helping others will bring you satisfaction and inner peace."
};

const dayPrediction={
Sunday:"Today is a good day to relax and spend time with family.",
Monday:"A good day for planning and starting new work.",
Tuesday:"Energy and determination will help you overcome challenges.",
Wednesday:"Communication and learning are favoured today.",
Thursday:"A suitable day for gaining knowledge and helping others.",
Friday:"Love, friendship and creativity are highlighted today.",
Saturday:"Patience and discipline will bring success."
};

document.getElementById("result").textContent =
"Hello, " + name + "!\n\n" +
"Welcome to the Lucky Number Finder.\n" +
"Your lucky day and lucky number are shown below.\n" +
"We hope you enjoy reading your personalized prediction.\n\n" +
"Name : " + name +
"\n\nPlace of Birth : " + place +
"\n\nDate of Birth : " + dob +
"\n\nDay of Birth : " + birthDay +
"\n\nDay Prediction\n\n" + dayPrediction[birthDay] +
"\n\nLucky Number : " + total +
"\n\nLucky Number Prediction\n\n" + prediction[total] +
"\n\n---------------------------------------" +
"\nThank you for using Lucky Number Finder." +
"\nDesigned and developed by Vedprakash Sharma." +
"\n\nThis Lucky Number Finder is based on a simple numerology calculation and is intended for entertainment purposes only.";
}

function retry(){
document.getElementById("name").value="";
document.getElementById("place").value="";
document.getElementById("dob").value="";
document.getElementById("result").textContent="";
document.getElementById("name").focus();
}
</script>
</body>
</html>
